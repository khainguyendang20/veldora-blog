<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Veldora Blog" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="alternate" type="application/rss+xml" title="Veldora Blog" href="/rss.xml" />
    <title>Veldora Blog</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <script>
      // Apply the saved (or system) color scheme before the app renders,
      // so dark mode doesn't flash white on load. Kept in sync by
      // useThemeStore (src/store).
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var dark = saved
            ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (error) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
